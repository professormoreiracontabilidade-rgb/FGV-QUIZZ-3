*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:19px;line-height:1.57;-webkit-text-size-adjust:100%}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #edb72a;outline-offset:3px}#app{max-width:840px;margin:0 auto;padding:12px 12px 102px}.mast{background:linear-gradient(125deg,#081d37,#153c68 77%,#205080);color:#fff;padding:18px 18px 20px;border-radius:18px 18px 7px 7px;border-bottom:5px solid var(--gold);box-shadow:0 10px 25px #081d371c}.brand{font-weight:900;letter-spacing:.035em;line-height:1.2;font-size:clamp(16px,4.6vw,21px)}.brand strong{color:#ffcf73;display:block;font-size:1.06em}.mastline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}.pill{background:#ffffff1b;border:1px solid #ffffff40;border-radius:40px;padding:6px 14px;font-weight:800;font-size:.87em}.whitecard{background:white;padding:18px;border-radius:7px 7px 16px 16px;border:1px solid var(--line);box-shadow:0 8px 22px #1128410b}.cover{padding:27px 20px 35px;text-align:center}.cover h1{font-size:clamp(32px,8vw,55px);color:var(--navy);line-height:1.1;margin:14px 0 18px;letter-spacing:-.025em}.eyebrow{font-size:.83em;letter-spacing:.13em;color:#385a7b;text-transform:uppercase;font-weight:900}.lede{font-size:1.12em;color:#3b536a;max-width:600px;margin:10px auto 27px}.highlights{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:550px;margin:26px auto}.hl{border:1px solid #d9e4ed;border-radius:13px;padding:12px 7px;background:#f8fbff}.hl b{display:block;font-size:1.7em;color:var(--navy)}.hl span{font-size:.72em;color:var(--muted);font-weight:700}.primary,.outline,.subtle,.danger{border-radius:14px;min-height:54px;padding:12px 18px;font-size:1.03em;font-weight:800}.primary{background:var(--navy);color:#fff;border:2px solid var(--navy);box-shadow:0 5px 13px #10325533}.outline{background:#fff;color:var(--navy);border:2px solid #9bb1c8}.subtle{background:#eef3f8;color:var(--navy);border:2px solid #d1deeb}.danger{background:#fff;color:#ad2f36;border:2px solid #e7b6b6}.primary:disabled,.outline:disabled,.subtle:disabled{opacity:.43;cursor:not-allowed}.big-btn{width:100%;max-width:540px}.minibtn{border:0;background:transparent;color:#365470;padding:7px;text-decoration:underline;font-size:.84em;font-weight:650}.questiontop{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--muted);font-size:.84em;font-weight:800;margin:12px 0 6px}.bar{height:12px;background:#d6e2ec;border-radius:14px;overflow:hidden;margin-bottom:17px}.bar>div{height:100%;background:linear-gradient(90deg,#f3bc48,#f7db8c);border-radius:inherit;transition:width .25s}.topic{display:inline-block;border-radius:20px;background:#e7eef7;color:#214a76;font-weight:800;font-size:.85em;padding:5px 12px;margin:3px 0 11px}.qtitle{font-size:clamp(22px,5.8vw,29px);line-height:1.42;margin:4px 0 18px;font-weight:750;white-space:pre-wrap}.answers{display:grid;gap:11px}.opt{display:flex;align-items:flex-start;gap:13px;border:2px solid #d9e4ec;padding:14px 13px;background:white;border-radius:14px;width:100%;text-align:left;line-height:1.46;font-size:1.04em;color:var(--ink)}.opt:not([disabled]):hover{border-color:#6a97c0;background:#f7faff}.opt.selected{border-color:var(--blue);background:#ecf4ff}.opt .letter{width:40px;height:40px;border-radius:10px;flex:0 0 40px;display:inline-grid;place-items:center;background:#e5edf6;color:#163960;font-weight:900}.opt.right{background:#e3f7e9;border-color:#238b5f}.opt.right .letter{background:#187b52;color:white}.opt.wrong{background:#ffe8e8;border-color:#ce4b51}.opt.wrong .letter{background:#bb3e45;color:white}.opt[disabled]{cursor:default;opacity:1}.tools{display:flex;gap:11px;align-items:center;margin-top:18px;flex-wrap:wrap}.tools .primary{flex:1}.tip{font-size:.82em;color:var(--muted);margin-top:10px}.feedback{margin-top:23px;border-radius:15px;overflow:hidden;border:1px solid #b8d9c7;background:#f6fff9;scroll-margin-top:12px}.feedback.fail{background:#fffaf9;border-color:#ecc3c5}.feedback .fhead{padding:13px 16px;background:#d7f2df;display:flex;align-items:center;gap:11px;font-weight:900;color:#116540;font-size:1.06em}.feedback.fail .fhead{background:#ffe6e6;color:#a83136}.status-icon{font-size:1.3em}.fbcontent{padding:15px 17px 19px}.fbcontent h3{font-size:1em;color:var(--navy);margin:13px 0 4px}.fbcontent p{margin:0 0 13px;white-space:pre-line}.gabarito{border-left:5px solid var(--gold);padding:10px 13px;margin:10px 0 17px;background:#fff8e8;border-radius:3px 10px 10px 3px;font-weight:850}.sourcehint{border:1px solid #e4d4ad;background:#fffaf0;border-radius:9px;margin-top:12px;padding:10px 13px;font-size:.87em;color:#705421}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;padding:8px max(12px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-right));background:#fbfcffed;backdrop-filter:blur(14px);border-top:1px solid #ccd8e4;box-shadow:0 -5px 25px #0924431a}.navin{max-width:830px;margin:auto;display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.nav .primary,.nav .outline,.nav .subtle{min-height:52px;font-size:.95em;padding:9px 8px}.nav .subtle{padding:9px 13px}.flash{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .15s;background:radial-gradient(circle at 50% 45%,#23e58574,#009b4a23 60%,#08854318);box-shadow:inset 0 0 0 14px #21bd5b88}.flash.error{background:radial-gradient(circle at 50% 45%,#fb32328a,#d92c2c24 60%,#b92a2a1c);box-shadow:inset 0 0 0 14px #d7323299}.flash.show{opacity:1}.flash .flashmsg{position:absolute;left:50%;top:12%;transform:translateX(-50%);background:#087449;color:#fff;box-shadow:0 5px 20px #10101033;border-radius:40px;padding:11px 25px;font-size:1.25em;font-weight:950;text-align:center;white-space:nowrap}.flash.error .flashmsg{background:#b92932}.results h2{font-size:2em;text-align:center;margin:14px 0}.score{font-size:clamp(55px,13vw,87px);color:var(--navy);text-align:center;line-height:1.2;font-weight:900}.scoresub{text-align:center;color:#53708c;margin:2px 0 22px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}.metric{background:#f4f8fc;border-radius:13px;text-align:center;padding:14px 8px}.metric strong{font-size:1.4em;display:block}.metric span{font-size:.75em;color:var(--muted);font-weight:750}.review{display:grid;gap:8px;margin-top:18px}.review button{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:#fff;padding:12px;border-radius:11px;color:var(--ink);text-align:left}.rmark{font-weight:900}.rmark.ok{color:#0d8757}.rmark.bad{color:#b63a3b}.rmark.skip{color:#667d90}.small{font-size:.85em;color:var(--muted)}.lightlabel{color:#ffd686;font-weight:900}.result-actions{display:grid;gap:10px;margin:18px 0 8px}

<script>
'use strict';
const QUIZ_NUM=3, DATA=[{"original":3,"topic":"CONCEITOS BÁSICOS DA CONTABILIDADE","prompt":"Uma entidade apresenta passivo a descoberto. Em relação à equação fundamental nesta entidade, assinale a opção correta.","options":["Passivo = Patrimônio Líquido – Ativo.","Passivo = Ativo + Patrimônio Líquido.","Patrimônio Líquido = Ativo + Passivo.","Ativo = Patrimônio Líquido – Passivo.","Ativo + Passivo + Patrimônio Líquido = 0."],"answer":"B","why":"O gabarito da coletânea marca B para a situação denominada passivo a descoberto, quando as obrigações superam os ativos. O conceito essencial para memorizar é patrimônio líquido negativo: PL = Ativo − Passivo.","others":"Atenção à notação: se o patrimônio líquido for representado com sinal negativo, a identidade algébrica universal é Passivo = Ativo − PL, e não Passivo = Ativo + PL. A letra B só se interpreta usando o valor absoluto do déficit; as demais expressões também não representam adequadamente a situação. Esta questão tem ambiguidade de sinal na redação."},{"original":8,"topic":"FATOS CONTÁBEIS","prompt":"Os fatos contábeis podem ser permutativos, modificativos ou mistos, a depender do seu efeito patrimonial. Um exemplo de fato contábil modificativo é o registro do(a):","options":["aquisição de móveis e utensílios;","compra de materiais para estoque;","depreciação de um veículo;","pagamento do principal de uma dívida;","recebimento por vendas a prazo."],"answer":"C","why":"A depreciação normalmente gera despesa e aumento da depreciação acumulada, reduzindo o resultado e o patrimônio líquido. Por isso é fato modificativo diminutivo.","others":"Aquisição de móveis, compra para estoque e pagamento do principal de dívida são permutas; recebimento de venda já registrada a prazo troca Clientes por Caixa, sem nova receita."},{"original":13,"topic":"ESCRITURAÇÃO E PARTIDAS DOBRADAS","prompt":"Os lançamentos contábeis são realizados a partir de contas patrimoniais e de resultado, que possuem objetivos e naturezas diferentes na composição das demonstrações contábeis. Em se tratando de uma despesa paga à vista, o lançamento a crédito deve ser feito em uma conta de:","options":["ativo;","passivo;","resultado;","fornecedores;","patrimônio líquido."],"answer":"A","why":"O pagamento à vista de uma despesa diminui Caixa ou Bancos, contas do ativo. Como ativos diminuem a crédito, o crédito é lançado em ativo.","others":"Passivo e PL não são necessariamente movimentados nesse pagamento; a despesa é debitada no resultado, não creditada; Fornecedores só apareceria caso existisse obrigação a liquidar."},{"original":18,"topic":"BALANÇO PATRIMONIAL","prompt":"Uma entidade que presta serviços contábeis adquiriu ações integrantes do capital social de outra sociedade, com o intuito de valorização. Em seu balanço patrimonial, essas ações são contabilizadas no ativo como","options":["circulante.","intangível.","imobilizado.","investimento.","realizável a longo prazo."],"answer":"D","why":"Ações adquiridas com finalidade de investimento duradouro ou valorização no contexto descrito são participações societárias apresentadas no grupo Investimentos do ativo não circulante.","others":"Não são bens corpóreos para uso (imobilizado), nem direitos sem substância física identificados como intangível; circulante e realizável a longo prazo dependem da natureza e destinação, e aqui o gabarito aponta Investimentos."},{"original":23,"topic":"ESTRUTURA CONCEITUAL (CPC 00)","prompt":"Um analista preparou a análise horizontal de cinco anos do balanço patrimonial de uma sociedade empresária. Este posicionamento vincula-se, na essência, à seguinte característica qualitativa de melhoria de informações financeiras úteis:","options":["materialidade.","tempestividade.","verificabilidade.","comparabilidade.","compreensibilidade."],"answer":"D","why":"A análise horizontal compara períodos, permitindo examinar tendências e mudanças. Ela depende da característica de melhoria chamada comparabilidade.","others":"Materialidade faz parte da relevância; tempestividade trata da disponibilidade a tempo; verificabilidade é possibilidade de corroborar a informação; compreensibilidade facilita entendê-la, mas não é a propriedade central da comparação entre anos."},{"original":28,"topic":"DEMONSTRAÇÃO DO RESULTADO (DRE)","prompt":"As opções a seguir trazem exemplos de informações que são apresentadas na Demonstração do Resultado do Exercício de uma entidade, à exceção de uma. Assinale-a:","options":["Devolução de vendas.","Provisão para imposto sobre a renda.","Resultado de operações descontinuadas.","Variação cambial.","Distribuição de dividendos."],"answer":"E","why":"Dividendos distribuídos são destinação do resultado aos proprietários, lançados no patrimônio líquido ou passivo, e não despesa da DRE.","others":"Devoluções, imposto sobre a renda, operações descontinuadas e variações cambiais podem afetar a demonstração do resultado e, portanto, são itens que podem constar da DRE."},{"original":33,"topic":"REGIME DE COMPETÊNCIA E CAIXA","prompt":"Assinale a opção que indica uma situação em que o reconhecimento da receita ou da despesa pelos Regimes de Caixa e de Competência acontecem no mesmo momento.","options":["Integralização de capital social pelos sócios em dinheiro.","Pagamento das despesas de salários relativas ao mês anterior.","Compra à vista de passagem aérea para viagem em 90 dias.","Pagamento de encomenda de um móvel que será entregue em 60 dias.","Pagamento de mensalidade do mês corrente de um curso que tem duração de 2 anos."],"answer":"E","why":"O pagamento de mensalidade do mês corrente corresponde à prestação referente ao mesmo mês: caixa e competência coincidem para essa parcela do serviço.","others":"Aporte de capital não é receita; salário do mês anterior gera diferença temporal; passagem para viagem futura e encomenda não entregue são despesas/adiantamentos que pertencem a períodos futuros."},{"original":38,"topic":"ESTOQUES (CPC 16)","prompt":"Assinale a opção que indica exemplo de itens que não são incluídos no custo dos estoques, de acordo com o Pronunciamento Técnico CPC 16 (R1) - Estoques.","options":["Custos com seguro.","Custos de transporte.","Imposto de importação.","Valor anormal de desperdício de materiais.","Tributos não recuperáveis junto ao FISCO."],"answer":"D","why":"Desperdícios anormais de materiais não compõem custo de estoque: são reconhecidos como despesa no período em que acontecem.","others":"Frete, seguro diretamente ligado à aquisição e tributos não recuperáveis podem integrar o custo de aquisição, assim como imposto de importação, desde que sejam necessários para trazer o item à condição e localização atuais."},{"original":43,"topic":"PEPS E CUSTO MÉDIO","prompt":"Uma empresa comercial decidiu mudar seu método de avaliação de estoque de \"PEPS\" para \"UEPS\" em um período de alta de custos. Nesse sentido, considerando- se as informações apresentadas, o resultado da mudança no estoque final e no lucro líquido são:","options":["mesmo valor do estoque final e aumento do lucro líquido;","aumento do estoque final e diminuição do lucro líquido;","diminuição do estoque final e aumento do lucro líquido;","aumento do estoque final e aumento do lucro líquido;","diminuição do estoque final e diminuição do lucro líquido."],"answer":"E","why":"Trocar PEPS por UEPS em alta de preços implica saída dos lotes mais caros no CMV: o estoque final diminui e o lucro líquido tende a cair.","others":"As demais opções supõem estoque igual ou maior ou lucro maior; isso contraria o efeito do aumento do CMV. A comparação é didática: UEPS não é permitido pelo CPC 16 para reporte contábil."},{"original":48,"topic":"ATIVO IMOBILIZADO (CPC 27)","prompt":"Em uma sociedade empresária, são classificados(as) como “Ativo Imobilizado em Andamento”","options":["os melhoramentos e as obras integradas aos terrenos utilizados.","os bens incorpóreos destinados à manutenção das atividades.","as peças destinadas à substituição em máquinas e equipamentos.","os bens utilizados para deslocamento de pessoal ou transporte de mercadorias.","os bens em uso durante a fase pré-operacional, relativos ao desenvolvimento de um projeto."],"answer":"E","why":"Ativo imobilizado em andamento compreende bens e projetos ainda na fase de implantação ou preparação para uso, inclusive determinados bens empregados durante a fase pré-operacional do projeto.","others":"Melhoramentos já integrados a terrenos em uso, intangíveis, peças de reposição e bens de transporte em uso não descrevem necessariamente o grupo “em andamento” apontado na questão."},{"original":53,"topic":"DEPRECIAÇÃO E AMORTIZAÇÃO","prompt":"Em relação ao reconhecimento do uso de ativos, assinale a opção correta.","options":["Um direito autoral sofre depreciação.","Uma floresta sofre amortização.","Uma reserva de petróleo sofre exaustão.","Uma obra de arte sofre depreciação.","O terreno da sede da empresa sofre exaustão."],"answer":"C","why":"Reserva de petróleo é recurso natural exaurível: o consumo de suas reservas gera exaustão.","others":"Direitos autorais com vida definida são amortizados, floresta e petróleo são exauridos; obra de arte normalmente não é depreciada sob vida útil indefinida, e terreno não sofre exaustão pelo uso comum."},{"original":58,"topic":"ATIVO INTANGÍVEL (CPC 04)","prompt":"No balanço patrimonial, uma classe de ativos intangíveis constitui um grupo de ativos de natureza e com utilização similar nas atividades da entidade. Assinale a opção que indica ativos intangíveis classificados na mesma classe.","options":["Licenças e franquias.","Softwares e patentes.","Marcas e títulos de periódicos.","Direitos de propriedade industrial e protótipos.","Direitos autorais e ativos intangíveis em desenvolvimento."],"answer":"A","why":"Licenças e franquias são direitos contratuais de natureza semelhante e podem formar uma classe de intangíveis.","others":"Software e patente têm funções distintas; marcas e periódicos podem ter características diferentes; propriedade industrial e protótipos, direitos autorais e intangíveis em desenvolvimento são misturas que não representam, no gabarito, a classe homogênea solicitada."},{"original":63,"topic":"IMPAIRMENT (CPC 01)","prompt":"Uma empresa operacional possui investimentos em controladas que atuam em diversos setores econômicos. Esta investidora está se preparando para realizar o teste da recuperabilidade de suas participações societárias. Assinale o investimento que tem maior probabilidade de reconhecimento do teste de recuperabilidade.","options":["a Cia Alfa está em fase pré-operacional.","a Cia Beta não distribuiu dividendos obrigatórios nos últimos três anos.","a Cia Gama comprou participação societária na Cia Penta e pagou Goodwill.","a Cia Delta vendeu a participação societária na Cia Zeta.","a Cia Epsilon comprou participação societária na Cia Sigma e não pagou Goodwill."],"answer":"B","why":"A falta reiterada de dividendos obrigatórios pode sinalizar dificuldades de geração/distribuição de resultados e indicar necessidade de avaliação do valor recuperável do investimento, conforme o gabarito da coletânea.","others":"Fase pré-operacional, aquisição com ou sem goodwill e venda de outro investimento, isoladamente, não sinalizam com a mesma clareza a desvalorização da participação. Observação: a existência de indicação exige análise concreta, não reconhecimento automático de perda."},{"original":68,"topic":"CLIENTES E PECLD","prompt":"Em 31/12/2022, uma sociedade empresária apresentava em seu balanço patrimonial um saldo de R$43.200 na conta “Clientes”. A composição da conta era a seguinte: Contas a receber de clientes: R$45.000; Perdas estimadas com crédito de liquidação duvidosa: (R$1.800). Em janeiro de 2023, todos os clientes pagaram o que deviam. O recebimento trouxe um aumento no Resultado de","options":["zero.","R$1.800.","R$43.200.","R$45.000.","R$46.800."],"answer":"B","why":"Ao pagar R$ 45.000 integralmente, deixa de ser necessária a PECLD de R$ 1.800. A reversão dessa estimativa eleva o resultado em R$ 1.800.","others":"O recebimento em si troca Clientes por Caixa, sem criar nova receita; R$ 43.200 e R$ 45.000 representam valores do ativo/recebível, não o efeito no resultado, e R$ 46.800 não decorre dos dados."},{"original":73,"topic":"DESPESAS ANTECIPADAS","prompt":"Em 01/04/2017, uma entidade pagou antecipadamente o seguro de seus veículos com vigência de quatro anos, no valor de R$ 96.000, com início de utilização imediata. Assinale a opção que indica a contabilização da despesa antecipada com seguro no Balanço patrimonial da entidade, em 31/12/2017.","options":["Ativo Circulante: R$ 18.000 / Ativo não Circulante: R$ 78.000.","Ativo Circulante: R$ 24.000 / Ativo não Circulante: R$ 54.000.","Ativo Circulante: R$ 24.000 / Ativo não Circulante: R$ 72.000.","Ativo Circulante: R$ 42.000 / Ativo não Circulante: R$ 54.000.","Ativo Circulante: 0 / Ativo não Circulante: R$ 78.000."],"answer":"B","why":"Custo mensal = R$ 96.000/48 = R$ 2.000. De abril a dezembro transcorreram 9 meses: despesa R$ 18.000; saldo antecipado R$ 78.000, sendo R$ 24.000 nos 12 meses seguintes (AC) e R$ 54.000 depois (ANC).","others":"As outras opções erram os meses transcorridos, a divisão entre curto e longo prazo ou deixam de reconhecer a parcela do ativo circulante."},{"original":78,"topic":"PROVISÕES E CONTINGÊNCIAS","prompt":"Em relação às provisões, assinale a afirmativa correta.","options":["Apresentam valor ou prazo incertos.","Derivam de eventos que irão ocorrer.","Devem ser contabilizadas no passivo circulante.","Devem ser contabilizadas como redutoras do ativo.","Sua existência será confirmada pela ocorrência de eventos futuros, que estão sob o controle da entidade."],"answer":"A","why":"Provisões são passivos cujo valor ou momento de liquidação é incerto, embora cumpram critérios de reconhecimento.","others":"Elas decorrem de eventos passados e obrigação presente, não simplesmente futuros; podem ser circulantes ou não; não são redutoras do ativo; contingências condicionadas a eventos futuros exigem análise distinta."},{"original":83,"topic":"DEMONSTRAÇÃO DOS FLUXOS DE CAIXA","prompt":"Uma sociedade empresária elabora a sua demonstração dos fluxos de caixa pelo método indireto. Assinale a opção que indica um fato que pode ser apresentado nesta demonstração, como ajuste ao lucro líquido.","options":["compra de ativo imobilizado a prazo.","resgate de títulos de valores mobiliários.","integralização de capital social com terrenos.","despesa de depreciação do ativo imobilizado.","pagamento de dividendos aos acionistas por meio de imóveis."],"answer":"D","why":"A depreciação reduz lucro, mas não consome caixa no período; no método indireto ela é adicionada de volta ao lucro como ajuste não monetário.","others":"Compra a prazo, integralização com terreno e pagamento em imóveis são transações sem caixa; resgate de títulos pode gerar fluxo, mas não é ajuste de depreciação ao lucro líquido solicitado."},{"original":88,"topic":"DEMONSTRAÇÃO DO VALOR ADICIONADO","prompt":"De acordo com a NBC TG 09– Demonstração do Valor Adicionado, o seguinte item deve ser contabilizado como Outras Receitas, em Valor Adicionado Recebido em Transferência:","options":["Receitas financeiras.","Ativo construído para uso próprio.","Venda de ativo imobilizado com lucro.","Resultado de equivalência patrimonial.","Dividendos relativos a investimentos avaliados ao custo."],"answer":"E","why":"Dividendos de investimentos avaliados pelo custo são rendimento recebido de outra entidade e integram “valor adicionado recebido em transferência”, na rubrica indicada pelo enunciado.","others":"Receitas financeiras e equivalência patrimonial também podem figurar em transferência, porém em rubricas específicas; construção para uso próprio não é transferência e venda de imobilizado é classificada de outra maneira na DVA."},{"original":93,"topic":"RESERVAS DE LUCROS","prompt":"O estatuto de uma sociedade empresária previa, anualmente, a constituição de uma reserva com o intuito de segregar uma parcela dos lucros, correspondente a prováveis perdas extraordinárias futuras. Ao final de cada exercício, a sociedade empresária deveria constituir reserva","options":["legal.","estatutária.","para retenção.","para contingências.","de lucros a realizar."],"answer":"D","why":"Uma reserva destinada a fazer frente a provável perda extraordinária futura de valor estimável é reserva para contingências, ainda que o estatuto a mencione.","others":"Reserva legal tem destinação legal geral; estatutária atende regras do estatuto, mas a finalidade específica prevalece; retenção e lucros a realizar têm outros objetivos."},{"original":98,"topic":"DIVIDENDOS","prompt":"O valor dos dividendos calculados e ainda não pagos será evidenciado na demonstração","options":["do resultado do exercício.","das mutações do patrimônio líquido.","de lucros ou prejuízos acumulados.","do fluxo de caixa.","balanço patrimonial."],"answer":"E","why":"Dividendos reconhecidos como obrigação mas ainda não pagos constam do passivo no Balanço Patrimonial, normalmente como Dividendos a Pagar.","others":"DRE mede receitas e despesas e não registra distribuição de lucros como despesa; DMPL e DLPA mostram movimentação do patrimônio líquido, e DFC registra quando há pagamento em caixa."}], TAG='moreira_quiz_fgv_2026_v3_'+QUIZ_NUM;
const app=document.querySelector('#app'), footer=document.querySelector('#footer');
const letters=['A','B','C','D','E'];
let state={screen:'cover',index:0,selected:Array(20).fill(null),confirmed:Array(20).fill(false)};
try{let prior=JSON.parse(localStorage.getItem(TAG)||'null');if(prior&&prior.selected?.length===20&&prior.confirmed?.length===20){state={...state,index:Math.max(0,Math.min(19,prior.index||0)),selected:prior.selected,confirmed:prior.confirmed};}}catch(e){}
function save(){try{localStorage.setItem(TAG,JSON.stringify({index:state.index,selected:state.selected,confirmed:state.confirmed}));}catch(e){}}
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const asText=s=>escapeHTML(s).replace(/\n/g,'<br>');
const result=()=>({n:state.confirmed.filter(Boolean).length,good:state.confirmed.filter((c,i)=>c&&letters[state.selected[i]]===DATA[i].answer).length});
function mast(head){return `<header class="mast"><div class="brand">CURSO DE CONTABILIDADE <strong>PROFESSOR MOREIRA</strong></div><div class="mastline"><span class="pill">QUESTÕES BÁSICAS DA FGV</span><span class="pill">QUIZ ${QUIZ_NUM} DE 5</span></div></header>`;}
function render(){let view='';if(state.screen==='cover'){let score=result();view=mast()+`<section class="whitecard cover"><div class="eyebrow">Treinamento interativo • FGV</div><h1>Questões Básicas da FGV</h1><div class="lede">20 questões de Contabilidade Geral, abrangendo 20 assuntos diferentes. Responda, confirme e veja a correção detalhada imediatamente abaixo.</div><div class="highlights"><div class="hl"><b>20</b><span>QUESTÕES</span></div><div class="hl"><b>20</b><span>ASSUNTOS</span></div><div class="hl"><b>${score.n}</b><span>JÁ RESPONDIDAS</span></div></div><button class="primary big-btn" data-act="start">${score.n?'▶ Continuar de onde parou':'▶ Começar o Quiz '+QUIZ_NUM}</button><p class="small">Sem senha e sem trava. Funciona sem internet depois de salvo. Seu progresso fica neste navegador.</p>${score.n?'<button class="minibtn" data-act="reset">Reiniciar todas as respostas</button>':''}</section>`;footer.hidden=true;}
else if(state.screen==='results'){let s=result(),pct=Math.round(s.good/20*100),miss=s.n-s.good;view=mast()+`<section class="whitecard results"><div class="eyebrow">Relatório do aluno — Quiz ${QUIZ_NUM}</div><h2>Resultado do treinamento</h2><div class="score">${pct}%</div><div class="scoresub">${s.good} acertos em 20 questões • pontuação de 0 a 100%</div><div class="metrics"><div class="metric"><strong>${s.good}</strong><span>ACERTOS</span></div><div class="metric"><strong>${miss}</strong><span>ERROS</span></div><div class="metric"><strong>${20-s.n}</strong><span>NÃO RESPONDIDAS</span></div></div><p>${s.good===20?'Excelente! Você acertou todas as questões.':s.good>=15?'Bom desempenho. Revise especialmente os erros comentados.':'Revise as explicações e refaça as questões com atenção aos conceitos.'}</p><div class="result-actions"><button class="primary" data-act="review">↩ Rever as questões</button><button class="outline" data-act="cover">⌂ Voltar à capa</button><button class="danger" data-act="reset">⟳ Reiniciar Quiz ${QUIZ_NUM}</button></div><h3>Revisão por assunto</h3><div class="review">${DATA.map((q,i)=>{let status=state.confirmed[i]?(letters[state.selected[i]]===q.answer?'ok':'bad'):'skip';return `<button data-act="jump" data-index="${i}"><span><strong>${String(i+1).padStart(2,'0')}.</strong> ${escapeHTML(q.topic)}</span><span class="rmark ${status}">${status==='ok'?'✓':status==='bad'?'✕':'—'}</span></button>`}).join('')}</div></section>`;footer.hidden=true;}
else{let i=state.index,q=DATA[i],done=state.confirmed[i],chosen=state.selected[i],correctIdx=letters.indexOf(q.answer),pass=done&&chosen===correctIdx,s=result();view=mast()+`<section class="whitecard"><div class="questiontop"><span>QUESTÃO ${i+1} DE 20</span><span>${s.n} respondidas</span></div><div class="bar" role="progressbar" aria-valuenow="${s.n}" aria-valuemax="20"><div style="width:${s.n/20*100}%"></div></div><span class="topic">${escapeHTML(q.topic)}</span><h2 class="qtitle">${asText(q.prompt)}</h2><div class="answers" role="radiogroup" aria-label="Selecione uma alternativa">${q.options.map((o,j)=>`<button class="opt ${chosen===j?'selected':''} ${done?(j===correctIdx?'right':(j===chosen?'wrong':'')):''}" data-act="select" data-option="${j}" ${done?'disabled':''} aria-pressed="${chosen===j}"><span class="letter">${letters[j]}</span><span>${asText(o)}</span></button>`).join('')}</div><div class="tools">${!done?`<button class="primary" data-act="confirm" ${chosen==null?'disabled':''}>✓ Confirmar resposta</button>`:`<button class="subtle" data-act="redo">↺ Refazer esta questão</button>`}</div>${done?`<article class="feedback ${pass?'':'fail'}" id="correcao"><div class="fhead"><span class="status-icon">${pass?'✓':'✕'}</span>${pass?'Você acertou! Luz verde.':'Você errou. Luz vermelha.'}</div><div class="fbcontent"><div class="gabarito">GABARITO DA COLETÂNEA: ALTERNATIVA ${q.answer} — ${escapeHTML(q.options[correctIdx])}</div><h3>Por que essa alternativa está correta?</h3><p>${asText(q.why)}</p><h3>Por que as outras alternativas estão incorretas?</h3><p>${asText(q.others)}</p><div class="sourcehint">Correção didática elaborada a partir das questões e do gabarito da coletânea fornecida. Quando há ressalvas, elas aparecem no comentário.</div></div></article>`:''}</section>`;
footer.hidden=false;footer.innerHTML=`<div class="navin"><button class="outline" data-act="prev" ${i===0?'disabled':''}>← Voltar</button><button class="primary" data-act="next">${i===19?'Finalizar ✓':'Avançar →'}</button><button class="subtle" data-act="reset" title="Reiniciar as 20 questões" aria-label="Reiniciar quiz">⟳</button></div>`;}
app.innerHTML=view;}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'});}
function flash(success){let el=document.querySelector('#flash');el.className='flash '+(success?'':'error')+' show';document.querySelector('#flashmsg').textContent=success?'✓ ACERTOU!':'✕ ERROU!';window.clearTimeout(flash.t);flash.t=setTimeout(()=>el.classList.remove('show'),900);}
function reset(){if(confirm('Reiniciar este quiz? Isso apagará as respostas salvas das 20 questões.')){state.index=0;state.selected=Array(20).fill(null);state.confirmed=Array(20).fill(false);state.screen='cover';save();render();scrollTop();}}
function nav(i){state.index=Math.min(19,Math.max(0,i));state.screen='question';save();render();scrollTop();}
document.addEventListener('click',e=>{let btn=e.target.closest('button[data-act]');if(!btn)return;let cmd=btn.dataset.act;if(cmd==='start'){nav(state.index);}
else if(cmd==='select'){if(!state.confirmed[state.index]){state.selected[state.index]=Number(btn.dataset.option);save();render();}}
else if(cmd==='confirm'){let i=state.index,q=DATA[i];if(state.selected[i]==null||state.confirmed[i])return;state.confirmed[i]=true;save();render();flash(letters[state.selected[i]]===q.answer);setTimeout(()=>document.querySelector('#correcao')?.scrollIntoView({block:'start',behavior:'smooth'}),90);}
else if(cmd==='redo'){state.confirmed[state.index]=false;state.selected[state.index]=null;save();render();}
else if(cmd==='prev'){nav(state.index-1);}
else if(cmd==='next'){state.index===19?(state.screen='results',save(),render(),scrollTop()):nav(state.index+1);}
else if(cmd==='reset'){reset();}
else if(cmd==='review'){nav(0);}
else if(cmd==='jump'){nav(Number(btn.dataset.index));}
else if(cmd==='cover'){state.screen='cover';save();render();scrollTop();}});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&state.screen==='question'&&!e.altKey&&!e.ctrlKey){if(state.index===19){state.screen='results';render();scrollTop();}else nav(state.index+1);}if(e.key==='ArrowLeft'&&state.screen==='question'&&!e.altKey&&!e.ctrlKey&&state.index>0)nav(state.index-1);});
render();
</script></body></html>
